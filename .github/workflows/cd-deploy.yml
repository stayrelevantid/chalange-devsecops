name: SecureBank CD

on:
  workflow_run:
    workflows: ["SecureBank CI"]
    types: [completed]
    branches: [develop, staging, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/securebank-api
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-image:
    name: Build and publish release image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build --tag "$IMAGE:$IMAGE_TAG" securebank-api
      - name: Scan release image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Push image
        run: docker push "$IMAGE:$IMAGE_TAG"
      - id: image
        run: echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy DEV (simulation)
    needs: build-image
    if: github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Install kustomize
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: Render and validate DEV manifests
        run: |
          kustomize build securebank-api/k8s/overlays/dev | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/dev.yaml
          kubeconform -strict -ignore-missing-schemas /tmp/dev.yaml
      - name: Simulate deployment and health check
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker pull "$IMAGE:$IMAGE_TAG"
          docker run -d --rm --name securebank-dev -p 18080:8080 "$IMAGE:$IMAGE_TAG"
          trap 'docker stop securebank-dev' EXIT
          for attempt in {1..15}; do curl -fsS http://127.0.0.1:18080/health && exit 0; sleep 2; done
          exit 1

  deploy-staging:
    name: Deploy STAGING (simulation)
    needs: build-image
    if: github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Render STAGING manifests
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/staging | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/staging.yaml
          kubeconform -strict -ignore-missing-schemas /tmp/staging.yaml
          echo "STAGING deployment simulation passed"

  deploy-prod:
    name: Deploy PROD (simulation)
    needs: build-image
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Render PROD manifests
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/prod | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/prod.yaml
          kubeconform -strict -ignore-missing-schemas /tmp/prod.yaml
          echo "PROD deployment simulation passed"

  post-deployment-verification:
    name: Post-deployment verification
    needs: deploy-prod
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production overlay and image reference
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/prod > /tmp/prod.yaml
          grep -q 'kind: Deployment' /tmp/prod.yaml
          grep -q 'kind: Service' /tmp/prod.yaml
          echo 'Post-deployment verification passed'
