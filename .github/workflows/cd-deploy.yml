name: SecureBank CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/securebank-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-image:
    name: Build and publish release image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build --tag "$IMAGE:$IMAGE_TAG" securebank-api
      - name: Scan release image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Push image
        run: docker push "$IMAGE:$IMAGE_TAG"
      - id: image
        run: echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy DEV (simulation)
    needs: build-image
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Install kustomize
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
      - name: Render and validate DEV manifests
        run: |
          kustomize build securebank-api/k8s/overlays/dev | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/dev.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/dev.yaml
      - name: Simulate deployment and health check
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker pull "$IMAGE:$IMAGE_TAG"
          docker run -d --rm --name securebank-dev -p 18080:8080 "$IMAGE:$IMAGE_TAG"
          trap 'docker stop securebank-dev' EXIT
          for attempt in {1..15}; do curl -fsS http://127.0.0.1:18080/health && exit 0; sleep 2; done
          exit 1

  deploy-staging:
    name: Deploy STAGING (simulation)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Render STAGING manifests
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/staging | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/staging.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/staging.yaml
          echo "STAGING deployment simulation passed"

  deploy-uat:
    name: Deploy UAT (simulation)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - name: Render UAT manifests
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/uat | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/uat.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/uat.yaml
          echo "UAT deployment simulation passed"

  security-approval:
    name: Security Approval (manual)
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: security-approval
    steps:
      - name: Print security sign-off checklist
        run: |
          echo 'SECURITY APPROVAL REQUIRED'
          echo '- CI security-gate passed'
          echo '- Release image scan passed'
          echo '- UAT manifests validated'
          echo '- Reviewer confirms residual risk and release scope'

  deploy-prod:
    name: Deploy PROD (simulation)
    needs: security-approval
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Render PROD manifests
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/prod | sed "s|ghcr.io/stayrelevantid/securebank-api:latest|$IMAGE:$IMAGE_TAG|g" > /tmp/prod.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/prod.yaml
          echo "PROD deployment simulation passed"

  post-deployment-verification:
    name: Post-deployment verification
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production overlay and image reference
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          kustomize build securebank-api/k8s/overlays/prod > /tmp/prod.yaml
          grep -q 'kind: Deployment' /tmp/prod.yaml
          grep -q 'kind: Service' /tmp/prod.yaml
          echo 'Post-deployment verification passed'
