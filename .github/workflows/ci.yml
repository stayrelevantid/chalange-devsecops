name: SecureBank CI

on:
  push:
    branches: [main, develop, staging, uat]
  pull_request:
    branches: [develop, staging, uat, main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build & Test (Go 1.26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test with Race Detection & Coverage
        run: go test -v -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: securebank-api/coverage.out

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gitleaks binary
        uses: actions/cache@v4
        id: cache-gitleaks
        with:
          path: /usr/local/bin/gitleaks
          key: gitleaks-8.30.1

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          GITLEAKS_VERSION="8.30.1"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . -v --config .gitleaks.toml

  sca-scan:
    name: SCA Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Update Trivy DB
        run: trivy image --download-db-only 2>/dev/null || true

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'securebank-api'
          format: 'json'
          output: 'trivy-sca.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca.json

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Semgrep
        uses: actions/cache@v4
        with:
          path: ~/.semgrep
          key: semgrep-rules-${{ hashFiles('.semgrep.yml') }}
          restore-keys: |
            semgrep-rules-

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/owasp-top-ten
            .semgrep.yml

  dast-scan:
    name: DAST Scan (OWASP ZAP)
    needs: [build-and-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Go binary
        run: go build -o securebank ./cmd/api

      - name: Start SecureBank API
        run: JWT_SECRET=ci-test-secret PORT=8080 ./securebank &
        env:
          JWT_SECRET: ci-test-secret
          PORT: '8080'

      - name: Wait for API health
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && echo "API is healthy" && exit 0
            echo "Waiting for API... attempt $i/15"
            sleep 2
          done
          echo "API failed to start" && exit 1

      - name: ZAP Baseline Scan
        run: |
          docker run --network host --rm \
            -v "$PWD:/zap/wrk/:rw" \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -J zap-report.json \
            -I
        continue-on-error: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-report.html
            zap-report.json
          if-no-files-found: warn

  iac-checkov:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: securebank-api/terraform/
          framework: terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: checkov-results.sarif

  iac-trivy:
    name: IaC Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-iac-${{ github.run_id }}
          restore-keys: |
            trivy-iac-
            trivy-db-

      - name: Update Trivy DB
        run: trivy image --download-db-only 2>/dev/null || true

      - name: Run Trivy IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'securebank-api/terraform/'
          format: 'json'
          output: 'trivy-iac.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy IaC Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-report
          path: trivy-iac.json

  image-build-and-scan:
    name: Container Build & Image Scan
    needs: [build-and-test, secret-scan, sca-scan, sast-scan, iac-checkov, iac-trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag securebank:ci-${{ github.sha }} securebank-api

      - name: Scan image for blocking vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securebank:ci-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Export image metadata
        run: docker image inspect securebank:ci-${{ github.sha }} --format '{{.Id}}'

  promotion-policy:
    name: Promotion Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate allowed promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD" in
            develop:feature/*|develop:day-59-cicd|staging:develop|staging:resolve-*|uat:staging|main:uat)
              echo "Valid promotion path: $HEAD -> $BASE"
              ;;
            *)
              echo "Invalid promotion path: $HEAD -> $BASE"
              echo "Allowed: feature/* -> develop -> staging -> uat -> main"
              exit 1
              ;;
          esac

      - name: Allow branch push validation
        if: github.event_name != 'pull_request'
        run: echo "Promotion policy is enforced on pull requests"

  security-gate:
    name: Security Gate
    needs: [build-and-test, secret-scan, sca-scan, sast-scan, dast-scan, iac-checkov, iac-trivy, image-build-and-scan, promotion-policy]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All blocking security checks passed"

  upload-defectdojo:
    name: DefectDojo Upload
    needs: [sca-scan, sast-scan, iac-checkov, iac-trivy]
    runs-on: ubuntu-latest
    if: ${{ vars.DEFECTDOJO_URL != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Trivy SCA Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-sca-report
          path: ./reports

      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: ./reports

      - name: Download Checkov IaC Report
        uses: actions/download-artifact@v4
        with:
          name: checkov-report
          path: ./reports

      - name: Upload Trivy SCA to DefectDojo
        run: |
          curl -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Trivy Scan" \
            -F "product_name=SecureBank API" \
            -F "engagement_name=Q3 Security Audit" \
            -F "file=@reports/trivy-sca.json"

      - name: Upload Semgrep to DefectDojo
        run: |
          curl -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "product_name=SecureBank API" \
            -F "engagement_name=Q3 Security Audit" \
            -F "file=@reports/semgrep-report.json"

      - name: Upload Checkov IaC to DefectDojo
        run: |
          curl -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Checkov Scan" \
            -F "product_name=SecureBank API" \
            -F "engagement_name=Q3 Security Audit" \
            -F "file=@reports/checkov-report.json"
