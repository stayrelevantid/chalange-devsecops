services:
  securebank:
    build:
      context: .
      dockerfile: Dockerfile
    image: securebank:v1
    ports:
      - "8080:8080"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.25"
          memory: 64M
    environment:
      - JWT_SECRET=dev-secret-change-in-production
      - PORT=8080
    restart: unless-stopped