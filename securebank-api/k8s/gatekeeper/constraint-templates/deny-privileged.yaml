apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedprivileged
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedPrivileged
      validation:
        openAPIV3Schema:
          type: object
          properties: {}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedprivileged

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged
          msg := sprintf("Container '%v' is privileged (privileged: true) — K8s escape risk", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          container.securityContext.privileged
          msg := sprintf("Init container '%v' is privileged (privileged: true) — K8s escape risk", [container.name])
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostPID
          msg := "Pod sets hostPID: true — host PID namespace access is a K8s escape risk"
        }
