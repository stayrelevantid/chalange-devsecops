apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-api
  namespace: securebank
  labels:
    app: securebank-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securebank-api
  template:
    metadata:
      labels:
        app: securebank-api
    spec:
      containers:
        - name: api
          image: securebank:v1
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: securebank-secrets