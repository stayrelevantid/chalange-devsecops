- rule: Shell spawned in SecureBank container
  desc: Detect shell execution in securebank containers. Distroless pods have no shell — if shell appears, it's suspicious.
  condition: >
    spawned_process and
    container and
    container.image.repository contains "securebank" and
    proc.name in (bash, sh, ash, zsh)
  output: >
    ALERT: Shell opened in SecureBank container
    (user=%user.name container=%container.name
    image=%container.image.repository command=%proc.cmdline
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: WARNING
  tags: [securebank, shell, mitre_execution]

- rule: Sensitive file read in SecureBank
  desc: Detect access to sensitive paths in securebank containers (credentials, environment secrets)
  condition: >
    open_read and
    container and
    container.image.repository contains "securebank" and
    (fd.name startswith /etc/shadow or
     fd.name startswith /etc/passwd or
     fd.name startswith /proc/self/environ or
     fd.name startswith /root/.ssh or
     fd.name startswith /var/run/secrets)
  output: >
    ALERT: Sensitive file read in SecureBank
    (file=%fd.name user=%user.name container=%container.name
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [securebank, filesystem, mitre_credential_access]

- rule: Network tool in SecureBank container
  desc: Detect network reconnaissance tools in securebank containers (potential lateral movement or data exfil)
  condition: >
    spawned_process and
    container and
    container.image.repository contains "securebank" and
    proc.name in (nc, ncat, nmap, wget, curl, dig, nslookup, socat)
  output: >
    ALERT: Network tool detected in SecureBank
    (tool=%proc.name user=%user.name pod=%k8s.pod.name
    namespace=%k8s.ns.name command=%proc.cmdline)
  priority: NOTICE
  tags: [securebank, network, mitre_discovery]

- rule: K8s API access from SecureBank
  desc: >
    Detect contact to K8s API server from securebank containers.
    automountServiceAccountToken: false means no token mounted —
    any API server contact is suspicious (attacker may have found credentials).
  condition: >
    evt.type=connect and
    (fd.typechar=4 or fd.typechar=6) and
    container and
    container.image.repository contains "securebank" and
    k8s_api_server
  output: >
    ALERT: K8s API server contact from SecureBank
    (connection=%fd.name rport=%fd.rport user=%user.name
    pod=%k8s.pod.name namespace=%k8s.ns.name
    command=%proc.cmdline)
  priority: WARNING
  tags: [securebank, k8s, mitre_discovery]

- rule: Privileged container launched (K8s escape enabler)
  desc: >
    Detect any container launched with privileged: true. A privileged pod is the
    #1 K8s escape primitive — OPA blocks it in securebank, but if an attacker can
    deploy it elsewhere (e.g. default namespace), they can reach the node.
  condition: >
    spawned_process and
    container and
    container.privileged=true and
    not k8s.pod.name startswith "falco"
  output: >
    ALERT: Privileged container launched
    (user=%user.name container=%container.name
    image=%container.image.repository
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [k8s_escape, mitre_privilege_escalation]

- rule: Container escape via setns (nsenter)
  desc: >
    Detect setns syscall that switches a process into another namespace.
    nsenter (part of util-linux) is the classic container escape tool —
    combined with a privileged/hostPID pod it gives root on the node.
  condition: >
    evt.type=setns and
    container and
    proc.name in (nsenter)
  output: >
    ALERT: Container escape via setns/nsenter
    (user=%user.name container=%container.name
    proc=%proc.name command=%proc.cmdline
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [k8s_escape, mitre_privilege_escalation]

- rule: Read kubelet credentials post-escape
  desc: >
    Detect reading of node kubelet credentials (kubelet.kubeconfig / client
    certs) right after a container escape. On k3s they live directly under
    /var/lib/rancher/k3s/agent, on kubeadm under /etc/kubernetes.
    NOTE: match exact filenames only — a prefix match on the agent dir
    false-positives on containerd snapshot paths (containerd stores every
    container rootfs under /var/lib/rancher/k3s/agent/containerd/...).
  condition: >
    open_read and
    (fd.name endswith kubelet.kubeconfig or
     fd.name endswith kubeproxy.kubeconfig or
     fd.name endswith k3scontroller.kubeconfig or
     fd.name endswith client-kubelet.crt or
     fd.name endswith client-kubelet.key or
     fd.name startswith /etc/kubernetes)
  output: >
    ALERT: Kubelet credentials read
    (file=%fd.name user=%user.name proc=%proc.name
    command=%proc.cmdline container=%container.name
    pod=%k8s.pod.name namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [k8s_escape, mitre_credential_access]
